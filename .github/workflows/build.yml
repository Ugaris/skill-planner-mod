name: Build Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Client release whose mod-sdk.zip provides the Windows import library.
  CLIENT_SDK_TAG: v1.2.39

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: bmod.so
          - os: macos-latest
            platform: macos
            artifact: bmod.dylib
          - os: windows-latest
            platform: windows
            artifact: bmod.dll

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            unzip

      - name: Fetch client import library (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          # Windows mods MUST link the client's import library; without it
          # every client API reference is unresolved and the game crashes.
          curl -fsSL -o mod-sdk.zip \
            "https://github.com/eddoww/astonia_community_client/releases/download/${CLIENT_SDK_TAG}/mod-sdk.zip"
          unzip -oq mod-sdk.zip
          mkdir -p lib
          cp mod-sdk/lib/moac.a mod-sdk/lib/moac.lib lib/

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/bmod.dll bmod.dll

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build build
          cp build/bmod.dylib bmod.dylib

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/bmod.so bmod.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows/bmod.dll
            artifacts/macos/bmod.dylib
            artifacts/linux/bmod.so
          generate_release_notes: true
